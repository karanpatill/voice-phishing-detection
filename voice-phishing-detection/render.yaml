services:
  - type: web
    name: voice-phishing-detection
    runtime: python
    buildCommand: bash build.sh
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.6"
